<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Struk Digital — Cuanin POS</title>
    <style>
      :root {
        --brand: #1F7A5A;
        --brand-dark: #15563f;
        --bg: #ece9e0;
        --card: #ffffff;
        --ink: #1f1e1d;
        --muted: #6b6a68;
        --border: #d6d3c8;
        --danger: #9b1c12;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px 14px 40px;
      }
      .wrap {
        width: 100%;
        max-width: 390px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid #e2e0d8;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
      }
      .top-bar {
        height: 8px;
        background: var(--brand);
      }
      .inner {
        padding: 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .center { text-align: center; }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: #e4f1ea;
        color: var(--brand);
        font-size: 22px;
        font-weight: 700;
        margin: 0 auto 6px;
      }
      .badge.void {
        background: #fbe4e1;
        color: var(--danger);
      }
      .shop-name { font-size: 19px; font-weight: 800; }
      .sub { font-size: 12px; color: var(--muted); line-height: 1.45; }
      .italic { font-style: italic; }
      .dashed {
        border-top: 1px dashed var(--border);
        padding-top: 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        font-size: 13px;
        line-height: 1.5;
      }
      .row.muted { color: var(--muted); font-size: 12px; }
      .row.danger { color: var(--danger); }
      .row.total { font-size: 17px; font-weight: 800; padding-top: 4px; }
      .row.total .val { color: var(--brand); }
      .item { display: flex; flex-direction: column; gap: 2px; }
      .item-note { font-size: 11px; color: var(--muted); font-style: italic; }
      .items { display: flex; flex-direction: column; gap: 9px; }
      .meta { display: flex; flex-direction: column; gap: 4px; }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      button {
        height: 44px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--ink);
      }
      button.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      button.primary:hover { background: var(--brand-dark); }
      .status-box {
        background: #fff;
        border: 1px solid #e2e0d8;
        border-radius: 16px;
        padding: 28px 18px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }
      .footer-brand {
        text-align: center;
        font-size: 11px;
        color: #8b8880;
        margin-top: 2px;
      }
      @media print {
        body { background: #fff; padding: 0; }
        .actions, .footer-brand { display: none !important; }
        .card { box-shadow: none; border: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="app">
      <div class="status-box">Memuat struk digital...</div>
    </div>

    <script>
      const appEl = document.getElementById('app');

      function formatRp(n) {
        const val = Math.round(Number(n) || 0);
        const sign = val < 0 ? '-' : '';
        return sign + 'Rp' + Math.abs(val).toLocaleString('id-ID');
      }

      function formatWaktu(iso) {
        try {
          const d = new Date(iso);
          const tgl = d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
          const jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
          return `${tgl} · ${jam}`;
        } catch {
          return iso || '';
        }
      }

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function decodeBase64Url(b64url) {
        let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4 !== 0) b64 += '=';
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder().decode(bytes);
      }

      function renderReceiptPngAndDownload(r) {
        const width = 560;
        const padX = 40;
        const contentW = width - padX * 2;
        let estHeight = 320;
        if (r.h) estHeight += 24;
        if (r.a && r.a !== '-') estHeight += 24;
        if (r.p) estHeight += 24;
        if (r.c) estHeight += 26;
        for (const it of r.it || []) {
          estHeight += 50;
          if (it.ct) estHeight += 22;
        }
        if ((r.d || 0) > 0) estHeight += 54;
        if (r.m === 'Cash') estHeight += 54;
        estHeight += 110;

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = estHeight;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, estHeight);
        ctx.fillStyle = '#1F7A5A';
        ctx.fillRect(0, 0, width, 12);

        let y = 52;
        const drawCenter = (text, font, color, gap = 24) => {
          ctx.font = font;
          ctx.fillStyle = color;
          ctx.textAlign = 'center';
          ctx.fillText(text, width / 2, y, contentW);
          y += gap;
        };
        const drawRow = (left, right, font, cL, cR = cL, gap = 24) => {
          ctx.font = font;
          ctx.fillStyle = cL;
          ctx.textAlign = 'left';
          ctx.fillText(left, padX, y, contentW * 0.65);
          ctx.fillStyle = cR;
          ctx.textAlign = 'right';
          ctx.fillText(right, width - padX, y, contentW * 0.35);
          y += gap;
        };
        const drawDashed = () => {
          ctx.save();
          ctx.strokeStyle = '#D6D3C8';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([6, 5]);
          ctx.beginPath();
          ctx.moveTo(padX, y - 6);
          ctx.lineTo(width - padX, y - 6);
          ctx.stroke();
          ctx.restore();
          y += 18;
        };

        drawCenter(r.u || 'Cuanin POS', 'bold 26px Inter, system-ui, sans-serif', '#1F1E1D', 28);
        if (r.h) drawCenter(r.h, 'italic 15px Inter, system-ui, sans-serif', '#6B6A68', 22);
        if (r.a && r.a !== '-') drawCenter(r.a, '14px Inter, system-ui, sans-serif', '#6B6A68', 22);
        if (r.p) drawCenter('Telp/WA: ' + r.p, '14px Inter, system-ui, sans-serif', '#6B6A68', 24);

        y += 6;
        drawDashed();
        drawRow('No. Struk', r.n || '-', 'bold 15px Inter, system-ui, sans-serif', '#6B6A68', '#1F1E1D', 24);
        drawRow('Waktu', formatWaktu(r.w), '14px Inter, system-ui, sans-serif', '#6B6A68', '#1F1E1D', 24);
        if (r.k) drawRow('Kasir', r.k, '14px Inter, system-ui, sans-serif', '#6B6A68', '#1F1E1D', 24);
        if (r.c) drawRow('Pelanggan / Meja', r.c, 'bold 14px Inter, system-ui, sans-serif', '#6B6A68', '#1F1E1D', 24);
        drawRow('Metode Bayar', r.m || 'Cash', 'bold 14px Inter, system-ui, sans-serif', '#6B6A68', '#1F7A5A', 22);

        drawDashed();
        for (const it of r.it || []) {
          drawRow(it.nm, formatRp(it.hj * it.q), 'bold 16px Inter, system-ui, sans-serif', '#1F1E1D', '#1F1E1D', 22);
          ctx.font = '13px Inter, system-ui, sans-serif';
          ctx.fillStyle = '#6B6A68';
          ctx.textAlign = 'left';
          ctx.fillText(`${it.q} x ${formatRp(it.hj)}`, padX, y);
          y += 22;
          if (it.ct) {
            ctx.font = 'italic 13px Inter, system-ui, sans-serif';
            ctx.fillText('Catatan: ' + it.ct, padX, y, contentW);
            y += 20;
          }
          y += 4;
        }

        drawDashed();
        if ((r.d || 0) > 0) {
          drawRow('Subtotal', formatRp(r.s), '15px Inter, system-ui, sans-serif', '#6B6A68', '#1F1E1D', 24);
          drawRow(r.dl || 'Diskon', '−' + formatRp(r.d), '15px Inter, system-ui, sans-serif', '#9B1C12', '#9B1C12', 26);
        }
        drawRow('TOTAL', formatRp(r.t), 'bold 22px Inter, system-ui, sans-serif', '#1F1E1D', '#1F7A5A', 30);
        if (r.m === 'Cash') {
          drawRow('Tunai Diterima', formatRp(r.b), '15px Inter, system-ui, sans-serif', '#6B6A68', '#1F1E1D', 24);
          drawRow('Kembalian', formatRp(r.kb), '15px Inter, system-ui, sans-serif', '#6B6A68', '#1F1E1D', 24);
        }

        y += 6;
        drawDashed();
        drawCenter(r.f || 'Terima kasih sudah berbelanja!', '14px Inter, system-ui, sans-serif', '#4A4947', 24);
        drawCenter('Powered by Cuanin POS', '12px Inter, system-ui, sans-serif', '#9A9893', 20);

        const finalH = Math.min(estHeight, y + 20);
        const cropped = document.createElement('canvas');
        cropped.width = width;
        cropped.height = finalH;
        cropped.getContext('2d').drawImage(canvas, 0, 0, width, finalH, 0, 0, width, finalH);

        cropped.toBlob((blob) => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `struk-${String(r.n || 'cuanin').replace(/[^a-zA-Z0-9]/g, '')}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, 'image/png');
      }

      function renderView(r) {
        document.title = `Struk ${r.n || ''} — ${r.u || 'Cuanin POS'}`;
        const isVoid = r.st === 'void';
        const itemsHtml = (r.it || [])
          .map(
            (it) => `
          <div class="item">
            <div class="row">
              <span><strong>${esc(it.nm)}</strong> ×${esc(it.q)}</span>
              <span><strong>${formatRp(it.hj * it.q)}</strong></span>
            </div>
            <div class="sub">@ ${formatRp(it.hj)}${it.ct ? ` · <span class="italic">Catatan: ${esc(it.ct)}</span>` : ''}</div>
          </div>`
          )
          .join('');

        appEl.innerHTML = `
          <div class="card">
            <div class="top-bar"></div>
            <div class="inner">
              <div class="center">
                <div class="badge ${isVoid ? 'void' : ''}">${isVoid ? '✕' : '✓'}</div>
                <div class="shop-name">${esc(r.u || 'Cuanin POS')}</div>
                ${r.h ? `<div class="sub italic">${esc(r.h)}</div>` : ''}
                ${r.a && r.a !== '-' ? `<div class="sub">${esc(r.a)}</div>` : ''}
                ${r.p ? `<div class="sub">WA/Telp: ${esc(r.p)}</div>` : ''}
              </div>

              <div class="meta dashed">
                <div class="row muted"><span>No. Struk</span><strong style="color:#1f1e1d">${esc(r.n)}</strong></div>
                <div class="row muted"><span>Waktu</span><span>${esc(formatWaktu(r.w))}</span></div>
                ${r.k ? `<div class="row muted"><span>Kasir</span><span>${esc(r.k)}</span></div>` : ''}
                ${r.c ? `<div class="row muted"><span>Pelanggan / Meja</span><strong style="color:#1f1e1d">${esc(r.c)}</strong></div>` : ''}
                <div class="row muted"><span>Metode Bayar</span><strong style="color:#1F7A5A">${esc(r.m)}</strong></div>
              </div>

              <div class="items dashed">${itemsHtml}</div>

              <div class="meta dashed">
                ${
                  (r.d || 0) > 0
                    ? `<div class="row muted"><span>Subtotal</span><span>${formatRp(r.s)}</span></div>
                       <div class="row danger"><span>${esc(r.dl || 'Diskon')}</span><span>−${formatRp(r.d)}</span></div>`
                    : ''
                }
                <div class="row total"><span>TOTAL</span><span class="val">${formatRp(r.t)}</span></div>
                ${
                  r.m === 'Cash'
                    ? `<div class="row muted"><span>Tunai Diterima</span><span>${formatRp(r.b)}</span></div>
                       <div class="row muted"><span>Kembalian</span><span>${formatRp(r.kb)}</span></div>`
                    : ''
                }
              </div>

              ${r.f ? `<div class="center sub dashed">${esc(r.f)}</div>` : ''}
            </div>
          </div>

          <div class="actions">
            <button type="button" class="primary" id="btnPng">Simpan Gambar PNG</button>
            <button type="button" id="btnPrint">Cetak / PDF</button>
          </div>
          <div class="footer-brand">Struk Digital Ringan (JSON) · Powered by Cuanin POS</div>
        `;

        document.getElementById('btnPng').addEventListener('click', () => renderReceiptPngAndDownload(r));
        document.getElementById('btnPrint').addEventListener('click', () => window.print());
      }

      async function boot() {
        const params = new URLSearchParams(window.location.search);
        const jsonUrl = params.get('json');
        const hash = window.location.hash || '';

        if (jsonUrl) {
          try {
            const res = await fetch(jsonUrl);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            renderView(data);
            return;
          } catch (err) {
            appEl.innerHTML = `<div class="status-box">Struk tidak ditemukan atau gagal dimuat.<br/><small>${esc(err.message)}</small></div>`;
            return;
          }
        }

        if (hash.startsWith('#struk=')) {
          try {
            const data = JSON.parse(decodeBase64Url(hash.slice(7)));
            renderView(data);
            return;
          } catch {
            // fallthrough
          }
        }

        appEl.innerHTML = `<div class="status-box"><strong>Cuanin Struk Digital</strong><br/><br/>Buka link struk dari WhatsApp untuk melihat & menyimpan gambar struk transaksi.</div>`;
      }

      boot();
    </script>
  </body>
</html>
